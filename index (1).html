function buildSection(id, title, fields, widget) {
  var sec = document.createElement("section");
  sec.className = "sec";
  sec.dataset.sec = id;
  sec.dataset.open = openSections[id] ? "1" : "0";

  var head = document.createElement("button");
  head.type = "button";
  head.className = "sec-head";
  head.innerHTML = '<span>' + esc(title) + '</span><span class="chev">▾</span>';
  head.addEventListener("click", function () { toggleSection(sec, id); });
  sec.appendChild(head);

  var body = document.createElement("div");
  body.className = "sec-body";
  fields.forEach(function (f) {
    if (f.free && state.layout.mode !== "freeform") return;
    body.appendChild(fieldRow(f));
  });
  sec.appendChild(body);
  return sec;
}

function toggleSection(sec, id) {
  var open = sec.dataset.open === "1";
  sec.dataset.open = open ? "0" : "1";
  openSections[id] = !open;
}

function applyFilter(q) {
  q = String(q || "").trim().toLowerCase();
  $$(".sec", pBody).forEach(function (sec) {
    var rows = $$(".row", sec);
    var visible = 0;
    rows.forEach(function (row) {
      var hay = (row.dataset.label || "") + " " + (row.textContent || "");
      var hit = !q || hay.toLowerCase().indexOf(q) !== -1;
      row.style.display = hit ? "" : "none";
      if (hit) visible++;
    });
    if (!q) {
      sec.style.display = "";
      sec.dataset.open = openSections[sec.dataset.sec] ? "1" : "0";
    } else {
      sec.style.display = visible ? "" : "none";
      if (visible) sec.dataset.open = "1";
    }
  });
}

function updateCssStatus() {
  var el = pBody.querySelector("#css-status");
  if (!el) return;
  var css = state.customCss || "";
  var opens = (css.match(/{/g) || []).length;
  var closes = (css.match(/}/g) || []).length;
  var msg;
  if (!css.trim()) msg = "No custom CSS yet. Anything you add is applied live to the page.";
  else if (opens !== closes) msg = "⚠ Unbalanced braces (" + opens + " { vs " + closes + " }) — the browser may ignore part of this CSS.";
  else msg = "✓ CSS applied (" + css.split(/\r?\n/).length + " lines).";
  el.textContent = msg;
  el.className = "hint";
  el.style.color = (css.trim() && opens !== closes) ? "#ffb3c2" : "";
}

/* ============================================================
   Actions
   ============================================================ */
function runAction(act, id) {
  switch (act) {
    case "fit-screen": fitToScreen(); break;
    case "tidy-widgets": tidyWidgets(); break;
    case "theme-light": applyPreset("light"); break;
    case "theme-dark": applyPreset("dark"); break;
    case "quotes-next": quotesNext(); break;
    case "export": exportConfig(); break;
    case "import-file": pickImportFile(); break;
    case "import-text-run": importFromText(); break;
    case "reset": confirmDialog("Reset the whole homepage to defaults? This erases your widgets, theme and CSS in this browser.", function () {
      pushUndo();
      state = defaultState();
      state.widgets = starterWidgets();
      selectedId = null;
      renderAll(); applyTheme(); renderSettings(); saveNow();
      toast("Homepage reset to defaults");
    }); break;
    case "css-copy": copyCss(); break;
    case "css-reset": confirmDialog("Clear all custom CSS?", function () {
      pushUndo();
      state.customCss = "";
      applyCustomCss();
      renderSettings();
      save();
      toast("Custom CSS cleared");
    }); break;
    case "bg-upload": pickImage(function (dataUrl) {
      pushUndo();
      state.page.bgImage = dataUrl;
      applyTheme(); renderSettings(); save();
      toast("Background image set. Large images can fill browser storage — keep it under a few MB.");
    }); break;
    case "bg-remove":
      pushUndo();
      state.page.bgImage = "";
      applyTheme(); renderSettings(); save();
      toast("Background image removed");
      break;
    case "img-upload": pickImage(function (dataUrl) {
      if (!id) return;
      var w = getWidget(id);
      if (!w) return;
      pushUndo();
      w.s.src = dataUrl;
      renderWidgetBody(id); save();
      toast("Image set from this device");
    }); break;
    case "todo-clear-done": {
      var w2 = getWidget(id);
      if (!w2) return;
      pushUndo();
      w2.s.items = (w2.s.items || []).filter(function (t) { return !t.done; });
      renderWidgetBody(id); save();
      break;
    }
    case "todo-clear-all": {
      var w3 = getWidget(id);
      if (!w3) return;
      confirmDialog("Delete all tasks in this list?", function () {
        pushUndo();
        w3.s.items = [];
        renderWidgetBody(id); save();
      });
      break;
    }
  }
}

function quotesNext() {
  state.widgets.forEach(function (w) {
    if (w.type !== "quote") return;
    w.s.idx = num(w.s.idx, 0) + 1;
    renderWidgetBody(w.id);
  });
  save();
}

function fitToScreen() {
  if (state.layout.mode !== "freeform") {
    toast("Switch to Freeform mode first.");
    return;
  }
  pushUndo();
  var avail = canvas.clientWidth - 8;
  var maxRight = 0;
  state.widgets.forEach(function (w) { maxRight = Math.max(maxRight, w.x + w.w); });
  var scale = maxRight > avail ? avail / maxRight : 1;
  state.widgets.forEach(function (w) {
    if (scale < 1) {
      w.x = Math.round(w.x * scale);
      w.y = Math.round(w.y * scale);
      w.w = Math.max(140, Math.round(w.w * scale));
      w.h = Math.max(90, Math.round(w.h * scale));
    }
    w.x = Math.max(0, Math.min(w.x, Math.max(0, avail - w.w)));
  });
  applyLayoutMode();
  save();
  toast(scale < 1 ? "Widgets scaled down to fit this screen" : "Widgets already fit this screen");
}

function tidyWidgets() {
  if (state.layout.mode !== "freeform") {
    toast("Switch to Freeform mode first.");
    return;
  }
  pushUndo();
  var cols = canvas.clientWidth > 900 ? 3 : (canvas.clientWidth > 560 ? 2 : 1);
  var gap = 16, x = 0, y = 0, rowH = 0, i = 0;
  var colW = Math.floor((canvas.clientWidth - gap * (cols - 1)) / cols);
  state.widgets.forEach(function (w) {
    if (w.visible === false) return;
    w.w = Math.min(w.w, colW);
    if (i % cols === 0 && i > 0) { y += rowH + gap; rowH = 0; }
    x = (i % cols) * (colW + gap);
    w.x = x; w.y = y;
    rowH = Math.max(rowH, w.h);
    i++;
  });
  applyLayoutMode();
  save();
  toast("Widgets arranged into a grid");
}

function seedPositionsFromLayout() {
  var cRect = canvas.getBoundingClientRect();
  state.widgets.forEach(function (w) {
    var el = canvas.querySelector('.widget[data-id="' + w.id + '"]');
    if (!el) return;
    var r = el.getBoundingClientRect();
    if (r.width < 1) return;
    w.x = Math.round(r.left - cRect.left);
    w.y = Math.round(r.top - cRect.top);
    w.w = Math.round(r.width);
    w.h = Math.max(90, Math.round(r.height));
  });
}

function applyPreset(kind) {
  pushUndo();
  var p = state.page;
  if (kind === "light") {
    p.bgColor = "#f3f3f7"; p.gradientOn = false;
    p.gradFrom = "#ffffff"; p.gradVia = "#f0f0f5"; p.gradTo = "#e6e6ee";
    p.text = "#22222c"; p.muted = "#5f5f70"; p.heading = "#0d0d14"; p.link = "#c4123a";
    p.widgetBg = "#ffffff"; p.widgetBgOpacity = 0.82; p.widgetBorder = "#000000"; p.widgetBorderAlpha = 0.1;
    p.overlayColor = "#ffffff"; p.overlayOpacity = 0.1; p.accent = "#d8123c";
  } else {
    p.bgColor = "#07070a"; p.gradientOn = true;
    p.gradFrom = "#0b0b12"; p.gradVia = "#170a14"; p.gradTo = "#05060a";
    p.text = "#e8e8f0"; p.muted = "#9a9aab"; p.heading = "#ffffff"; p.link = "#ff6b8a";
    p.widgetBg = "#12121a"; p.widgetBgOpacity = 0.72; p.widgetBorder = "#ffffff"; p.widgetBorderAlpha = 0.09;
    p.overlayColor = "#000000"; p.overlayOpacity = 0.22; p.accent = "#ff2d55";
  }
  applyTheme(); renderSettings(); save();
  toast(kind === "light" ? "Light theme applied" : "Dark theme applied");
}

/* ---------- custom css ---------- */
var cssStyleEl = null;
function applyCustomCss() {
  if (!cssStyleEl) {
    cssStyleEl = document.createElement("style");
    cssStyleEl.id = "void-custom-css";
    document.head.appendChild(cssStyleEl);
  }
  cssStyleEl.textContent = state.customCss || "";
  updateCssStatus();
}
function copyCss() {
  var css = state.customCss || "";
  if (!css.trim()) { toast("There is no custom CSS to copy."); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(css).then(function () { toast("CSS copied"); }, function () { toast("Copy failed — select the text manually.", true); });
  } else {
    toast("Clipboard is not available here — select the text manually.", true);
  }
}

/* ---------- export / import ---------- */
function exportConfig() {
  try {
    var data = JSON.stringify(state, null, 2);
    var blob = new Blob([data], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "void-homepage-backup.json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1500);
    toast("Backup file created — check your Downloads.");
  } catch (e) {
    toast("Export failed in this browser. Try copying the JSON from a backup file instead.", true);
  }
}

function validateImported(obj) {
  if (!obj || typeof obj !== "object" || Array.isArray(obj)) throw new Error("That JSON is not a VOID configuration object.");
  if (!Array.isArray(obj.widgets)) throw new Error("The file has no widgets array.");
  var bad = 0;
  obj.widgets = obj.widgets.filter(function (w) {
    if (!w || typeof w !== "object" || !w.type) { bad++; return false; }
    return true;
  });
  if (!obj.widgets.length) throw new Error("No usable widgets were found in that file.");
  return { obj: obj, dropped: bad };
}

function applyImported(obj) {
  pushUndo();
  var base = defaultState();
  var st = mergeDefaults(base, obj);
  st.widgets = (obj.widgets || []).map(normalizeWidget).filter(Boolean);
  if (!st.widgets.length) st.widgets = starterWidgets();
  st.customCss = typeof st.customCss === "string" ? st.customCss : "";
  state = st;
  selectedId = null;
  renderAll();
  applyTheme();
  applyCustomCss();
  renderSettings();
  startQuoteRotation();
  saveNow();
}

function importFromText() {
  var ta = pBody.querySelector("#import-text");
  if (!ta) return;
  var text = (ta.value || "").trim();
  if (!text) { toast("Paste a backup JSON first.", true); return; }
  var parsed;
  try { parsed = JSON.parse(text); }
  catch (e) { toast("That is not valid JSON: " + e.message, true); return; }
  try {
    var res = validateImported(parsed);
    applyImported(res.obj);
    toast("Configuration imported" + (res.dropped ? " (" + res.dropped + " invalid widget(s) skipped)" : ""));
    ta.value = "";
  } catch (e) {
    toast(e.message, true);
  }
}

function pickImportFile() {
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "application/json,.json";
  inp.addEventListener("change", function () {
    var f = inp.files && inp.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try { parsed = JSON.parse(String(reader.result)); }
      catch (e) { toast("That file is not valid JSON.", true); return; }
      try {
        var res = validateImported(parsed);
        confirmDialog("Replace the current homepage with this backup? Your current layout will be overwritten (Undo still works once).", function () {
          applyImported(res.obj);
          toast("Backup restored" + (res.dropped ? " (" + res.dropped + " invalid widget(s) skipped)" : ""));
        });
      } catch (e) {
        toast(e.message, true);
      }
    };
    reader.onerror = function () { toast("Could not read that file.", true); };
    reader.readAsText(f);
  });
  inp.click();
}

function pickImage(cb) {
  var inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.addEventListener("change", function () {
    var f = inp.files && inp.files[0];
    if (!f) return;
    if (f.size > 4 * 1024 * 1024) {
      toast("That image is " + (f.size / 1048576).toFixed(1) + " MB. Pick one under 4 MB so it fits in browser storage.", true);
      return;
    }
    var reader = new FileReader();
    reader.onload = function () { cb(String(reader.result)); };
    reader.onerror = function () { toast("Could not read that image.", true); };
    reader.readAsDataURL(f);
  });
  inp.click();
}

/* ============================================================
   Widget menu
   ============================================================ */
function openWidgetMenu(id, anchor) {
  var w = getWidget(id);
  if (!w) return;
  selectWidget(id, false);
  wmenu.innerHTML = "";
  var items = [
    { t: "Widget settings", a: function () { selectWidget(id, true); } },
    { t: "Bring to front", a: function () { moveLayer(id, "front"); } },
    { t: "Send to back", a: function () { moveLayer(id, "back"); } },
    { t: "Duplicate", a: function () { duplicateWidget(id); } },
    { t: w.locked ? "Unlock widget" : "Lock widget", a: function () { toggleLock(id); } },
    { t: w.visible === false ? "Show widget" : "Hide widget", a: function () { toggleVisible(id); } },
    { t: "Reset size", a: function () {
      var def = WIDGET_TYPES[w.type] || WIDGET_TYPES.empty;
      pushUndo();
      w.w = def.w || 340; w.h = def.h || 200;
      updateWidgetBox(w); save();
    } },
    { t: "Delete widget", danger: true, a: function () { confirmDialog("Delete this widget?", function () { deleteWidget(id); }); } }
  ];
  items.forEach(function (it, i) {
    if (i === 5) {
      var hr = document.createElement("hr");
      wmenu.appendChild(hr);
    }
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "menuitem");
    b.textContent = it.t;
    if (it.danger) b.className = "danger";
    b.addEventListener("click", function () {
      closeWidgetMenu();
      it.a();
    });
    wmenu.appendChild(b);
  });

  wmenu.classList.add("open");
  var r = anchor.getBoundingClientRect();
  var mw = wmenu.offsetWidth, mh = wmenu.offsetHeight;
  var left = Math.min(window.innerWidth - mw - 8, Math.max(8, r.right - mw));
  var top = r.bottom + 6;
  if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  wmenu.style.left = left + "px";
  wmenu.style.top = top + "px";
}
function closeWidgetMenu() { wmenu.classList.remove("open"); }

document.addEventListener("pointerdown", function (e) {
  if (wmenu.classList.contains("open") && !e.target.closest("#wmenu") && !e.target.closest('[data-act="w-menu"]')) {
    closeWidgetMenu();
  }
}, true);

function selectWidget(id, openPanel) {
  selectedId = id;
  openSections.selected = true;
  if (panel.classList.contains("open")) renderSettings();
  if (openPanel) openPanelUI();
  if (id) {
    var el = canvas.querySelector('.widget[data-id="' + id + '"]');
    if (el) {
      el.style.transition = "box-shadow .2s";
      el.style.boxShadow = "0 0 0 2px var(--accent), 0 0 24px rgba(255,45,85,.35)";
      setTimeout(function () { if (el) el.style.boxShadow = ""; }, 1200);
    }
  }
}

/* ============================================================
   Panel / sheet / modal / toast
   ============================================================ */
function openPanelUI() {
  renderSettings();
  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
}
function closePanelUI() {
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden", "true");
}

function openSheet() {
  var grid = $("#add-grid");
  grid.innerHTML = "";
  Object.keys(WIDGET_TYPES).forEach(function (type) {
    var def = WIDGET_TYPES[type];
    var b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<span class="ico">' + esc(def.icon || "▢") + "</span><span>" + esc(def.name) + "</span>";
    b.addEventListener("click", function () {
      closeSheet();
      addWidget(type);
    });
    grid.appendChild(b);
  });
  $("#sheet").classList.add("open");
  $("#sheet").setAttribute("aria-hidden", "false");
}
function closeSheet() {
  $("#sheet").classList.remove("open");
  $("#sheet").setAttribute("aria-hidden", "true");
}

var modalResolve = null;
function confirmDialog(msg, onYes) {
  var m = $("#modal");
  $("#modal-msg").textContent = msg;
  m.classList.add("open");
  modalResolve = onYes;
  $("#modal-yes").focus();
}
function closeModal(run) {
  $("#modal").classList.remove("open");
  var fn = modalResolve;
  modalResolve = null;
  if (run && fn) fn();
}

var toastTimer = null;
function toast(msg, isError) {
  toastEl.textContent = msg;
  toastEl.className = "show" + (isError ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.className = ""; }, isError ? 5200 : 2600);
}

/* ============================================================
   Toolbar
   ============================================================ */
function setEdit(on) {
  editMode = on;
  document.body.classList.toggle("editing", on);
  document.body.classList.toggle("view-mode", !on);
  $("#btn-edit").setAttribute("aria-pressed", on ? "true" : "false");
  if (on) toast("Edit mode: drag widgets by their title bar, resize from the red handles");
}
function setFreeform(on) {
  pushUndo();
  if (on && state.layout.mode !== "freeform") {
    if (canvas.clientWidth > 0) seedPositionsFromLayout();
    state.layout.mode = "freeform";
    if (!editMode) setEdit(true);
  } else if (!on) {
    state.layout.mode = "grid";
  }
  applyLayoutMode();
  syncToolbar();
  renderSettings();
  save();
  toast(on ? "Freeform canvas on — drag any widget anywhere" : "Responsive grid restored");
}
function syncToolbar() {
  $("#btn-free").setAttribute("aria-pressed", state.layout.mode === "freeform" ? "true" : "false");
  $("#btn-edit").setAttribute("aria-pressed", editMode ? "true" : "false");
  syncUndoBtns();
}

/* ============================================================
   Delegated events
   ============================================================ */
canvas.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  var act = t.getAttribute("data-act");
  var id = t.getAttribute("data-id");
  if (act === "w-menu") {
    e.stopPropagation();
    openWidgetMenu(id, t);
    return;
  }
  if (editMode && act !== "w-menu") return;
  if (act === "quote-next") {
    var w = getWidget(id);
    if (w) { w.s.idx = num(w.s.idx, 0) + 1; renderWidgetBody(id); save(); }
  } else if (act === "news-refresh") {
    var w2 = getWidget(id);
    if (w2) loadNews(w2);
  } else if (act === "todo-toggle") {
    var w3 = getWidget(id);
    if (!w3) return;
    var i = parseInt(t.getAttribute("data-i"), 10);
    if (w3.s.items && w3.s.items[i]) { w3.s.items[i].done = !w3.s.items[i].done; renderWidgetBody(id); save(); }
  } else if (act === "todo-del") {
    var w4 = getWidget(id);
    if (!w4) return;
    var j = parseInt(t.getAttribute("data-i"), 10);
    if (w4.s.items) { w4.s.items.splice(j, 1); renderWidgetBody(id); save(); }
  } else if (act === "search-clear") {
    var form = t.closest("form");
    if (form) { var inp = form.querySelector('input[type="search"]'); if (inp) { inp.value = ""; inp.focus(); } }
  }
});

canvas.addEventListener("submit", function (e) {
  var form = e.target;
  if (!form || !form.dataset || !form.dataset.form) return;
  e.preventDefault();
  var id = form.dataset.id;
  var w = getWidget(id);
  if (!w) return;

  if (form.dataset.form === "search") {
    var inp = form.querySelector('input[type="search"]');
    var q = inp ? inp.value.trim() : "";
    if (!q) { if (inp) inp.focus(); return; }
    var engine = w.s.engine || "google";
    var tpl = engine === "custom" ? String(w.s.customTemplate || "").trim() : ENGINES[engine];
    if (!tpl || tpl.indexOf("%s") === -1) {
      toast("This search engine has no valid URL template. Add one in the widget settings.", true);
      return;
    }
    var url = tpl.replace("%s", encodeURIComponent(q));
    if (!/^https?:\/\//i.test(url)) { toast("That search template is not an http(s) URL.", true); return; }
    window.open(url, "_blank", "noopener");
  } else if (form.dataset.form === "todo") {
    var ti = form.querySelector('input[type="text"]');
    var val = ti ? ti.value.trim() : "";
    if (!val) return;
    if (!Array.isArray(w.s.items)) w.s.items = [];
    w.s.items.push({ t: val, done: false });
    renderWidgetBody(id);
    save();
    var ni = canvas.querySelector('.widget[data-id="' + id + '"] input[data-s="task"]');
    if (ni) ni.focus();
  }
});

canvas.addEventListener("change", function (e) {
  var t = e.target;
  if (t && t.matches && t.matches('select[data-s="engine"]')) {
    var form = t.closest("form");
    if (!form) return;
    var w = getWidget(form.dataset.id);
    if (w) { w.s.engine = t.value; save(); }
  }
});

canvas.addEventListener("input", function (e) {
  var t = e.target;
  if (t && t.matches && t.matches("textarea[data-note]")) {
    var w = getWidget(t.getAttribute("data-note"));
    if (w) { w.s.text = t.value; save(); }
  }
});

/* ---------- toolbar wiring ---------- */
$("#btn-settings").addEventListener("click", function () {
  if (panel.classList.contains("open")) closePanelUI(); else openPanelUI();
});
$("#p-close").addEventListener("click", closePanelUI);
$("#btn-edit").addEventListener("click", function () { setEdit(!editMode); });
$("#btn-free").addEventListener("click", function () { setFreeform(state.layout.mode !== "freeform"); });
$("#btn-add").addEventListener("click", openSheet);
$("#btn-undo").addEventListener("click", function () {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify(state));
  applySnapshot(undoStack.pop());
  syncUndoBtns();
  toast("Undone");
});
$("#btn-redo").addEventListener("click", function () {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify(state));
  applySnapshot(redoStack.pop());
  syncUndoBtns();
  toast("Redone");
});
$("#p-search").addEventListener("input", function (e) { applyFilter(e.target.value); });
$("#sheet").addEventListener("click", function (e) {
  if (e.target.id === "sheet") closeSheet();
});
$("#modal-no").addEventListener("click", function () { closeModal(false); });
$("#modal-yes").addEventListener("click", function () { closeModal(true); });
$("#modal").addEventListener("click", function (e) { if (e.target.id === "modal") closeModal(false); });

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    if ($("#modal").classList.contains("open")) { closeModal(false); return; }
    if (wmenu.classList.contains("open")) { closeWidgetMenu(); return; }
    if ($("#sheet").classList.contains("open")) { closeSheet(); return; }
    if (panel.classList.contains("open")) { closePanelUI(); return; }
  }
  var tag = (e.target.tagName || "").toLowerCase();
  var typing = tag === "input" || tag === "textarea" || tag === "select";
  if (!typing && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
    e.preventDefault();
    (e.shiftKey ? $("#btn-redo") : $("#btn-undo")).click();
  }
});

/* flush pending saves before the page goes away */
function flushSave() {
  if (pendingSave) { saveNow(); pendingSave = false; }
}
document.addEventListener("visibilitychange", function () { if (document.hidden) flushSave(); });
window.addEventListener("pagehide", flushSave);
window.addEventListener("beforeunload", flushSave);

/* keep widgets usable after viewport changes */
var onResize = debounce(function () {
  if (state.layout.mode === "freeform") updateCanvasSize();
}, 200);
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", onResize);

/* ============================================================
   Boot
   ============================================================ */
function boot() {
  state = loadState();
  if (!Array.isArray(state.widgets) || !state.widgets.length) state.widgets = starterWidgets();

  // normalise z ordering
  state.widgets.sort(function (a, b) { return a.z - b.z; });
  state.widgets.forEach(function (w, i) { if (!w.z) w.z = i + 1; });

  renderAll();
  applyTheme();
  applyCustomCss();
  syncToolbar();
  startQuoteRotation();
  tickClocks();
  setInterval(tickClocks, 1000);
  saveNow();
}

boot();

// expose a tiny debug surface (useful, harmless)
window.VOID = {
  get state() { return state; },
  save: saveNow,
  reset: function () { state = defaultState(); state.widgets = starterWidgets(); renderAll(); applyTheme(); saveNow(); }
};

})();
</script>
</body>
